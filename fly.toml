# Fly.io config for the Nexora single-service deploy (Express API + Vite client).
# Deploy: fly launch (reuse this file) -> fly volumes create nexora_data --size 1
#          -> fly secrets set JWT_SECRET=<random> -> fly deploy
app = 'nexora-app'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[mounts]]
  source = 'nexora_data'
  destination = '/data'
